<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Snake</title>
<style>
  :root{--bg1:#1b2b1b;--bg2:#0d160d;--ink:#eafff0;--accent:#7be495;--grid:#16241a;--panel:#12241aee;}
  *{box-sizing:border-box;} html,body{height:100%;margin:0;}
  body{background:linear-gradient(var(--bg1),var(--bg2));color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;align-items:center;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);min-height:100%;}
  h1{margin:14px 0 6px;font-size:1.4rem;}
  #hud{display:flex;gap:16px;align-items:center;margin-bottom:8px;background:var(--panel);padding:8px 16px;border-radius:12px;font-weight:600;}
  #hud button{padding:6px 14px;border:none;border-radius:8px;background:var(--accent);color:#0d1a0f;font-weight:700;cursor:pointer;}
  canvas{width:100%;max-width:480px;height:auto;aspect-ratio:1/1;background:var(--grid);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.35);touch-action:none;}
  #controls{margin:10px 0 4px;font-size:.85rem;opacity:.8;text-align:center;max-width:420px;padding:0 12px;}
  #pad{display:grid;grid-template-columns:56px 56px 56px;grid-template-rows:56px 56px;gap:6px;margin-top:6px;}
  #pad button{border:none;border-radius:10px;background:var(--panel);color:var(--ink);font-size:1.3rem;font-weight:700;}
</style>
</head>
<body>
<h1>🐍 Snake</h1>
<div id="hud">
  <span>Score: <span id="score">0</span></span>
  <span>Best: <span id="best">0</span></span>
  <button id="startStop">Start</button>
</div>
<canvas id="game" width="400" height="400"></canvas>
<div id="controls">W A S D to steer. Eat the orange food, avoid walls and yourself.</div>
<div id="pad">
  <span></span><button id="pUp">▲</button><span></span>
  <button id="pLeft">◀</button><button id="pDown">▼</button><button id="pRight">▶</button>
</div>
<script>
(function(){
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const N = 20, CELL = canvas.width / N;
  let snake, dir, nextDir, food, score, best=0, running=false, tickMs=130, acc=0, lastT=0, dead=false;

  function reset(){
    snake = [{x:10,y:10},{x:9,y:10},{x:8,y:10}];
    dir = {x:1,y:0}; nextDir = dir; placeFood(); score=0; dead=false;
    document.getElementById('score').textContent = score;
  }
  function placeFood(){
    let ok=false;
    while(!ok){ food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}; ok=!snake.some(s=>s.x===food.x&&s.y===food.y); }
  }
  function step(){
    dir = nextDir;
    const head = {x:snake[0].x+dir.x, y:snake[0].y+dir.y};
    if(head.x<0||head.x>=N||head.y<0||head.y>=N||snake.some(s=>s.x===head.x&&s.y===head.y)){
      dead=true; running=false; document.getElementById('startStop').textContent='Start';
      if(score>best){ best=score; document.getElementById('best').textContent=best; }
      return;
    }
    snake.unshift(head);
    if(head.x===food.x && head.y===food.y){ score++; document.getElementById('score').textContent=score; placeFood(); }
    else snake.pop();
  }
  function draw(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle='#ff8a5b';
    ctx.beginPath(); ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, CELL*0.35, 0, Math.PI*2); ctx.fill();
    snake.forEach((s,i)=>{ ctx.fillStyle = i===0?'#a9ffbf':'#7be495'; ctx.fillRect(s.x*CELL+1,s.y*CELL+1,CELL-2,CELL-2); });
    if(dead){
      ctx.fillStyle='rgba(0,0,0,.5)'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#fff'; ctx.font='bold 26px sans-serif'; ctx.textAlign='center';
      ctx.fillText('Game Over — Start to retry', canvas.width/2, canvas.height/2);
    } else if(!running){
      ctx.fillStyle='rgba(0,0,0,.3)'; ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle='#fff'; ctx.font='bold 26px sans-serif'; ctx.textAlign='center';
      ctx.fillText('Paused — press Start', canvas.width/2, canvas.height/2);
    }
  }
  function loop(t){
    if(running){ acc += t-lastT; if(acc>tickMs){ acc=0; step(); } }
    lastT=t; draw(); requestAnimationFrame(loop);
  }
  function setDir(x,y){ if(dir.x===-x && dir.y===-y) return; nextDir={x,y}; }
  window.addEventListener('keydown', e=>{
    const k = e.key.toLowerCase();
    if(k==='w') setDir(0,-1);
    else if(k==='s') setDir(0,1);
    else if(k==='a') setDir(-1,0);
    else if(k==='d') setDir(1,0);
  });
  document.getElementById('pUp').onclick = ()=>setDir(0,-1);
  document.getElementById('pDown').onclick = ()=>setDir(0,1);
  document.getElementById('pLeft').onclick = ()=>setDir(-1,0);
  document.getElementById('pRight').onclick = ()=>setDir(1,0);
  const btn = document.getElementById('startStop');
  btn.addEventListener('click', ()=>{ if(dead) reset(); running=!running; btn.textContent = running?'Stop':'Start'; });
  reset(); requestAnimationFrame(loop);
})();
</script>
</body>
</html>
